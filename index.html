<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background:#EEF1F5; }
  .font-oswald { font-family: 'Oswald', sans-serif; }
  input[type="date"], input[type="time"], input[type="month"] { -webkit-appearance: none; appearance: none; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="gate" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1A2333;font-family:'Noto Sans JP',sans-serif;">
  <div style="background:#fff;border-radius:16px;padding:32px 28px;width:100%;max-width:340px;box-shadow:0 8px 30px rgba(0,0,0,0.25);">
    <div style="text-align:center;margin-bottom:20px;">
      <div style="font-family:'Oswald',sans-serif;font-size:22px;letter-spacing:0.15em;color:#1A2333;">PIVO</div>
      <div style="font-size:12px;color:#6B7683;margin-top:4px;">社内フォームDB ポータル</div>
    </div>
    <label style="display:block;font-size:13px;font-weight:bold;color:#1A2333;margin-bottom:8px;">パスワードを入力してください</label>
    <div style="position:relative;">
      <input id="gate-input" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
        style="width:100%;border:2px solid #C9D0DB;border-radius:8px;padding:12px 14px;font-size:16px;text-align:center;outline:none;color:#1A2333;caret-color:#1A2333;"
        />
      <div id="gate-mask" style="position:absolute;inset:2px;border-radius:6px;background:#fff;pointer-events:none;"></div>
    </div>
    <button id="gate-submit" style="margin-top:16px;width:100%;background:#1E4FD6;color:#fff;font-weight:bold;border:none;border-radius:8px;padding:14px;font-size:15px;cursor:pointer;">
      開く
    </button>
    <p id="gate-error" style="color:#D93025;font-size:12px;text-align:center;margin-top:10px;height:16px;"></p>
  </div>
</div>
<div id="root" style="display:none;"></div>

<script>
  // --- Password gate ---
  // A real type="password" input handles all typing natively (reliable on
  // every device/browser/IME), while an opaque overlay div sits on top of it
  // so neither the characters nor the browser's usual bullet/dot mask are
  // ever visible — meaning the number of characters typed is never revealed.
  (function () {
    const PASSCODE = "2026";
    const gate = document.getElementById('gate');
    const root = document.getElementById('root');
    const input = document.getElementById('gate-input');
    const btn = document.getElementById('gate-submit');
    const err = document.getElementById('gate-error');

    function tryUnlock() {
      if (input.value === PASSCODE) {
        gate.style.display = 'none';
        root.style.display = 'block';
      } else {
        err.textContent = 'パスワードが正しくありません';
        input.value = '';
        input.focus();
      }
    }

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { tryUnlock(); }
    });
    btn.addEventListener('click', tryUnlock);
    setTimeout(() => input.focus(), 100);
  })();
</script>
