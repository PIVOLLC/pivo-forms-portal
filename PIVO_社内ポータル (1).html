<script>
  // --- Password gate ---
  // The visible input is kept empty at all times (no characters, no dots),
  // so the number of characters typed is never revealed. Keystrokes are
  // tracked internally instead of relying on the input's own value.
  (function () {
    const PASSCODE = "2026";
    const gate = document.getElementById('gate');
    const root = document.getElementById('root');
    const input = document.getElementById('gate-input');
    const btn = document.getElementById('gate-submit');
    const err = document.getElementById('gate-error');
    let typed = '';

    function resetVisual() {
      input.value = '';
    }

    function tryUnlock() {
      if (typed === PASSCODE) {
        gate.style.display = 'none';
        root.style.display = 'block';
      } else {
        err.textContent = 'パスワードが正しくありません';
        typed = '';
        resetVisual();
        input.focus();
      }
    }

    input.addEventListener('input', () => {
      // Read whatever landed in the field (handles typing, paste, IME, etc.),
      // fold it into our tracked value, then immediately blank the field again.
      const chunk = input.value;
      if (chunk) {
        typed += chunk;
        if (typed.length > 32) typed = typed.slice(-32); // safety cap
      }
      resetVisual();
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { tryUnlock(); return; }
      if (e.key === 'Backspace') { typed = typed.slice(0, -1); }
    });
    btn.addEventListener('click', tryUnlock);
    setTimeout(() => input.focus(), 100);
  })();
</script>

const BACKEND_URL = "https://script.google.com/macros/s/AKfycbyLScAlp2Sc1teQ2fkdAM_dDwIlteKp9Gb88p9xSHKouerkKLFQpMtQSkVmMIya1RDc-Q/exec";

async function submitForm(formType, data, files) {
  const payload = { formType, data, files };
  const res = await fetch(BACKEND_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoid CORS preflight
    body: JSON.stringify(payload),
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || "送信に失敗しました");
  return json;
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result; // data:mime;base64,XXXX
      const base64 = result.split(",")[1];
      resolve({ name: file.name, mimeType: file.type, base64 });
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

      (pos) => { setGps(`${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`); setGpsStatus("done"); },

/* ================= シフト提出フォーム ================= */

function ShiftForm({ onSubmit }) {
  const a = ACCENTS.shift;
  const weekdays = ["月", "火", "水", "木", "金", "土", "日"];
  const today = new Date();
  const defaultMonth = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}`;
  const [month, setMonth] = useState(defaultMonth);
  const [sei, setSei] = useState("");
  const [mei, setMei] = useState("");
  const [pivoCode, setPivoCode] = useState("");
  const [memo, setMemo] = useState("");

  const [year, mo] = month.split("-").map(Number);
  const daysInMonth = new Date(year, mo, 0).getDate();
  const firstWeekday = (new Date(year, mo - 1, 1).getDay() + 6) % 7;

  const [status, setStatus] = useState({});

  const toggleDay = (day) => {
    setStatus((prev) => {
      const cur = prev[day] === undefined ? true : prev[day];
      return { ...prev, [day]: !cur };
    });
  };

  const cells = [];
  for (let i = 0; i < firstWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const realDays = cells.filter((d) => d !== null);
  const unavailDays = realDays.filter((d) => status[d] === false);
  const availDays = realDays.filter((d) => status[d] !== false);

  const handleSubmit = async () => {
    await onSubmit("shift", {
      sei, mei, pivoCode, month,
      availableDays: availDays.join("・"),
      unavailableDays: unavailDays.join("・"),
      memo,
    }, {});
  };

  return (
    <div className="space-y-4">
      <NoticeBox tone="info" title="翌月分のシフトは、毎月指定された日までに提出してください">カレンダーの日付をタップして、稼働できる日・できない日を選んでください。</NoticeBox>
      <Card>
        <CardTitle icon="user" title="基本情報" color={a.main} />
        <div className="space-y-5">
          <NameSplitFields sei={sei} mei={mei} onSei={setSei} onMei={setMei} />
          <PivoCodeField value={pivoCode} onChange={setPivoCode} />
          <Field label="対象月" required hint="シフトを提出する月を選択してください。">
            <TextInput type="month" value={month} onChange={(e) => setMonth(e.target.value)} />
          </Field>
        </div>
      </Card>

      <Card>
        <CardTitle icon="calendarDays" title="稼働可否の入力" color={a.main} badge="必須" />

/* ================= 安否確認フォーム ================= */

function SafetyForm({ onSubmit }) {
  const a = ACCENTS.safety;
  const [status, setStatus] = useState(null);
  const [workDay, setWorkDay] = useState(null);
  const [action, setAction] = useState(null);
  const [pivoCode, setPivoCode] = useState("");
  const [name, setName] = useState("");
  const [phone, setPhone] = useState("");
  const [memo, setMemo] = useState("");
  const [gps, setGps] = useState(null);
  const [gpsStatus, setGpsStatus] = useState("idle");

  const getGps = () => {
    setGpsStatus("loading");
    if (!navigator.geolocation) { setGpsStatus("error"); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => { setGps(`${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`); setGpsStatus("done"); },
      () => setGpsStatus("error"),
      { timeout: 8000 }
    );
  };

  const now = new Date();
  const sentAt = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, "0")}/${String(now.getDate()).padStart(2, "0")} ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;

  const chooseWorkDay = (v) => { setWorkDay(v); setAction(null); };

  const actionOptions = workDay === "休日" ? ["自宅などで安全確保", "避難中", "連絡は取れる状態", "不明・確認中"] : ["通常稼働", "稼働続行", "早退", "不明・確認中"];

  const handleSubmit = async () => {
    await onSubmit("safety", { sentAt, name, phone, pivoCode, status, workDay, action, gps, memo }, {});
  };

  return (
    <div className="space-y-4">
      <NoticeBox tone="danger" title="稼働日・休日にかかわらずご利用ください">災害・事故などの緊急時に、ご自身の状況を報告するフォームです。まずはご自身の安全を最優先に確保してください。安全が確保できてから送信してください。</NoticeBox>
      <Card>
        <CardTitle icon="user" title="基本情報" color={a.main} />
        <div className="space-y-5">
          <Field label="送信日時" required hint="自動で記録されます。">
            <div className="w-full bg-[#F5F7FA] border-2 border-[#DDE2EA] rounded-lg px-3.5 py-3 text-[16px] font-bold" style={{ ...SANS, color: INK }}>{sentAt}</div>
          </Field>
          <Field label="氏名" required><TextInput placeholder="例：田中 花子" value={name} onChange={(e) => setName(e.target.value)} /></Field>
          <Field label="電話番号" required hint="今つながる連絡先を入力してください。"><TextInput type="tel" placeholder="090-0000-0000" value={phone} onChange={(e) => setPhone(e.target.value)} /></Field>
          <PivoCodeField value={pivoCode} onChange={setPivoCode} />
        </div>
      </Card>

      <Card>
        <CardTitle icon="lifeBuoy" title="安否状況" color={a.main} badge="必須" />
        <p className="text-[13px] mb-3 leading-relaxed" style={{ ...SANS, color: "#4A5568" }}>現在のご自身の状態に最も近いものを選んでください。</p>
        <SelectGrid options={["安全・無事", "軽傷あり", "重傷・危険", "不明・確認中"]} value={status} onChange={setStatus} cols={2} color={a.main} />
      </Card>

      <Card>
        <CardTitle icon="info" title="本日の状況" color={a.main} badge="必須" />
        <p className="text-[13px] mb-3 leading-relaxed" style={{ ...SANS, color: "#4A5568" }}>本日は稼働日ですか、休日ですか。</p>
        <SelectGrid options={["稼働日", "休日"]} value={workDay} onChange={chooseWorkDay} cols={2} color={a.main} />
      </Card>

      <Card>
        <CardTitle icon="mapPin" title="現在地" color={a.main} badge={workDay === "稼働日" ? "必須" : "任意"} />
        <p className="text-[13px] mb-3 leading-relaxed" style={{ ...SANS, color: "#4A5568" }}>
          {workDay === "稼働日" ? "稼働中は現在地の取得が必須です。「現在地を取得」ボタンを押してください。" : "取得できる場合は、現在地を送信してください（任意）。"}
        </p>
        <div className="flex gap-2">
          <input readOnly value={gpsStatus === "done" && gps ? gps : ""} placeholder="未取得" className="flex-1 min-w-0 bg-[#F5F7FA] border-2 border-[#DDE2EA] rounded-lg px-3.5 py-3 text-[14px] placeholder:text-[#AEB6C2]" style={{ ...SANS, color: INK }} />
          <button type="button" onClick={getGps} className="px-5 rounded-lg text-[14px] font-bold text-white shrink-0" style={{ ...SANS, backgroundColor: a.main }}>{gpsStatus === "loading" ? "取得中…" : "現在地を取得"}</button>
        </div>
        {gpsStatus === "error" && (<p className="text-[12px] mt-2 font-bold" style={{ ...SANS, color: "#D93025" }}>位置情報を取得できませんでした。端末の位置情報設定を確認して、もう一度お試しください。</p>)}
        {gpsStatus === "done" && (<p className="text-[12px] mt-2 font-bold" style={{ ...SANS, color: "#2E7D5B" }}><Icon name="check" size={13} color="#2E7D5B" style={{marginRight:4}} />現在地を取得しました</p>)}
      </Card>

      {workDay && (
        <Card>
          <CardTitle icon="info" title="今後の対応" color={a.main} badge="必須" />
          <p className="text-[13px] mb-3 leading-relaxed" style={{ ...SANS, color: "#4A5568" }}>{workDay === "休日" ? "現在の状況に近いものを選んでください。" : "この後の稼働予定について選んでください。"}</p>
          <SelectGrid options={actionOptions} value={action} onChange={setAction} cols={2} color={INK} />
        </Card>
      )}

      <Card>
        <CardTitle icon="info" title="備考（被害状況など）" color={a.main} badge="任意" />
        <TextArea placeholder="建物の被害、必要なサポートなど、自由に記入してください。" value={memo} onChange={(e) => setMemo(e.target.value)} />
      </Card>

      <SubmitButton color={a.main} onClick={handleSubmit}>安否を報告する</SubmitButton>
    </div>
  );
}

      <NoticeBox tone="info" title="稼働を開始する前に、一度だけご入力ください">入力いただいた内容は、契約手続き・現場配置・スキルシート作成のために使用します。書類や写真は鮮明なものをご用意ください。</NoticeBox>

      <Card>
        <CardTitle icon="user" title="① 基本情報" color={a.main} />
        <div className="space-y-5">
          <Field label="氏名（漢字）" required>
            <div className="grid grid-cols-2 gap-2.5">
              <TextInput placeholder="山田" value={kanjiSei} onChange={(e) => setKanjiSei(e.target.value)} />
              <TextInput placeholder="太郎" value={kanjiMei} onChange={(e) => setKanjiMei(e.target.value)} />
            </div>
          </Field>
          <Field label="フリガナ" required>
            <div className="grid grid-cols-2 gap-2.5">
              <TextInput placeholder="ヤマダ" value={kanaSei} onChange={(e) => setKanaSei(e.target.value)} />
              <TextInput placeholder="タロウ" value={kanaMei} onChange={(e) => setKanaMei(e.target.value)} />
            </div>
          </Field>
          <div className="grid grid-cols-2 gap-3">
            <Field label="生年月日" required><TextInput type="date" value={birthDate} onChange={(e) => setBirthDate(e.target.value)} /></Field>
            <Field label="年齢" hint="生年月日から自動計算されます。">
              <div className="w-full bg-[#F5F7FA] border-2 border-[#DDE2EA] rounded-lg px-3.5 py-3 text-[16px] font-bold" style={{ ...SANS, color: INK }}>{age !== null ? `${age} 歳` : "―"}</div>
            </Field>
          </div>
          <Field label="性別" required><SelectGrid options={["男性", "女性", "回答しない"]} value={gender} onChange={setGender} cols={3} color={a.main} /></Field>
          <Field label="住所" required><TextInput placeholder="例：神奈川県川崎市〇〇1-2-3" value={address} onChange={(e) => setAddress(e.target.value)} /></Field>
          <Field label="電話番号" required><TextInput type="tel" placeholder="090-0000-0000" value={phone} onChange={(e) => setPhone(e.target.value)} /></Field>
          <Field label="メールアドレス" required><TextInput type="email" placeholder="example@email.com" value={email} onChange={(e) => setEmail(e.target.value)} /></Field>
          <Field label="緊急連絡先" required hint="ご本人以外の連絡先（続柄と電話番号）を入力してください。">
            <div className="grid grid-cols-2 gap-2.5">
              <TextInput placeholder="続柄（例：母）" value={emergencyRelation} onChange={(e) => setEmergencyRelation(e.target.value)} />
              <TextInput type="tel" placeholder="電話番号" value={emergencyPhone} onChange={(e) => setEmergencyPhone(e.target.value)} />
            </div>
          </Field>
        </div>
      </Card>

      <Card>
        <CardTitle icon="lock" title="② 本人確認・契約関連" color={a.main} />
        <div className="space-y-5">
          <Field label="本人確認書類の写し" required hint="運転免許証・マイナンバーカードなど、氏名と顔写真が確認できる書類を撮影・添付してください。">
            <input ref={idDocRef} type="file" accept="image/*,application/pdf" className="hidden" onChange={(e) => setIdDoc(e.target.files?.[0] || null)} />
            <button type="button" onClick={() => idDocRef.current?.click()} className="w-full flex items-center justify-center gap-2 border-2 border-dashed rounded-xl py-4 text-[14px] font-bold" style={{ ...SANS, borderColor: a.main, color: a.main, backgroundColor: idDoc ? a.soft : "white" }}>
              <Icon name="camera" size={16} style={{marginRight:6}} />{idDoc ? idDoc.name : "タップして撮影・アップロード"}
            </button>
          </Field>
          <Field label="インボイス登録番号" hint="登録状況を選択してください。取得済みの場合は番号も入力してください。">
            <SelectGrid options={["取得済み", "取得予定", "取得しない"]} value={invoiceStatus} onChange={setInvoiceStatus} cols={3} color={a.main} />
            {invoiceStatus === "取得済み" && (<div className="mt-2.5"><TextInput placeholder="T1234567890123" value={invoiceNumber} onChange={(e) => setInvoiceNumber(e.target.value)} /></div>)}
          </Field>
          <Field label="銀行口座情報（振込先）" required>
            <div className="space-y-2.5">
              <div className="grid grid-cols-2 gap-2.5">
                <TextInput placeholder="銀行名" value={bankName} onChange={(e) => setBankName(e.target.value)} />
                <TextInput placeholder="支店名" value={bankBranch} onChange={(e) => setBankBranch(e.target.value)} />
              </div>
              <SelectGrid options={["普通", "当座"]} value={bankType} onChange={setBankType} cols={2} color={a.main} />
              <TextInput placeholder="口座番号" value={bankNumber} onChange={(e) => setBankNumber(e.target.value)} />
              <TextInput placeholder="口座名義（カタカナ）" value={bankHolder} onChange={(e) => setBankHolder(e.target.value)} />
            </div>
          </Field>
          <AgreeRow checked={agreeAnti} onChange={setAgreeAnti} color={a.main}>反社会的勢力排除に関する誓約に同意します。</AgreeRow>
          <AgreeRow checked={agreeNda} onChange={setAgreeNda} color={a.main}>NDA（秘密保持契約）に同意します。</AgreeRow>
        </div>
      </Card>

      <Card>
        <CardTitle icon="mapPin" title="③ 稼働条件" color={a.main} />
        <div className="space-y-5">
          <Field label="稼働可能エリア" required hint="現場に出られる都道府県・最寄駅などを入力してください。">
            <TextInput placeholder="例：神奈川県・東京都南部／〇〇駅から30分圏内" value={area} onChange={(e) => setArea(e.target.value)} />
          </Field>
          <Field label="稼働可能な曜日" required><WeekdayMultiSelect value={availDays} onChange={setAvailDays} color={a.main} /></Field>
          <Field label="稼働可能な時間帯" hint="例：平日10:00〜18:00、土日は終日 など">
            <TextInput placeholder="例：平日10:00〜18:00" value={availTime} onChange={(e) => setAvailTime(e.target.value)} />
          </Field>
          <Field label="移動手段" required><SelectGrid options={["自家用車", "バイク", "公共交通機関"]} value={transport} onChange={setTransport} cols={3} color={a.main} /></Field>
        </div>
      </Card>

      <Card>
        <CardTitle icon="barChart" title="④ 経験・スキル" color={a.main} />
        <div className="space-y-5">
          <Field label="販売経験の有無" required><SelectGrid options={["あり", "なし"]} value={hasExperience} onChange={setHasExperience} cols={2} color={a.main} /></Field>
          {hasExperience === "あり" && (
            <div className="grid grid-cols-2 gap-2.5">
              <TextInput placeholder="経験年数（例：3年）" value={expYears} onChange={(e) => setExpYears(e.target.value)} />
              <TextInput placeholder="業界（例：携帯キャリア）" value={expIndustry} onChange={(e) => setExpIndustry(e.target.value)} />
            </div>
          )}
          <Field label="保有資格" hint="あれば入力してください（任意）。"><TextInput placeholder="例：普通自動車第一種運転免許" value={qualification} onChange={(e) => setQualification(e.target.value)} /></Field>
          <Field label="得意な販売スタイル" hint="当てはまるものを選んでください（任意）。">
            <div className="space-y-2">
              <SelectGrid options={["法人", "個人", "どちらも"]} value={styleTarget} onChange={setStyleTarget} cols={3} color={a.main} />
              <SelectGrid options={["店頭", "イベント", "どちらも"]} value={styleFormat} onChange={setStyleFormat} cols={3} color={a.main} />
            </div>
          </Field>
          <Field label="過去の実績" hint="簡単で構いません（任意）。"><TextArea placeholder="例：〇〇キャリア新規獲得 月間MVP2回" value={pastResults} onChange={(e) => setPastResults(e.target.value)} /></Field>
        </div>
      </Card>

      <Card>
        <CardTitle icon="camera" title="⑤ その他" color={a.main} />
        <Field label="顔写真" required hint="現場配置・スキルシート作成に使用します。正面・無帽・明るい場所で撮影してください。">
          <input ref={faceRef} type="file" accept="image/*" capture="user" className="hidden" onChange={(e) => setFacePhoto(e.target.files?.[0] || null)} />
          <button type="button" onClick={() => faceRef.current?.click()} className="w-full flex flex-col items-center justify-center gap-1.5 border-2 border-dashed rounded-xl py-6" style={{ borderColor: a.main, backgroundColor: facePhoto ? a.soft : "white" }}>
            <Icon name="camera" size={22} color={a.main} />
            <span className="text-[15px] font-bold" style={{ ...SANS, color: a.main }}>{facePhoto ? facePhoto.name : "タップしてカメラで撮影"}</span>
          </button>
        </Field>
      </Card>

      <SubmitButton color={a.main} onClick={handleSubmit} disabled={!canSubmit}>登録を申請する</SubmitButton>
      {!canSubmit && (<p className="text-[12px] text-center -mt-1" style={{ ...SANS, color: "#8A94A6" }}>※送信するには、誓約・NDAへの同意が必要です。</p>)}
    </div>
  );
}

/* ================= アプリ本体 ================= */

function PerformanceBrandMenu({ onSelect }) {
  const brands = [
    { key: "SBYM", label: "SBYM実績報告", desc: "SBYMブランドの稼働実績を報告します" },
    { key: "Docomo", label: "Docomo実績報告", desc: "Docomoブランドの稼働実績を報告します" },
    { key: "AuUQ", label: "AuUQ実績報告", desc: "AuUQブランドの稼働実績を報告します" },
  ];
  const a = ACCENTS.performance;
  return (
    <div className="space-y-4">
      <NoticeBox tone="info" title="ブランドを選択してください">ブランドごとに入力する実績項目が異なります。該当するブランドを選んでください。</NoticeBox>
      <div className="space-y-2.5">
        {brands.map(({ key, label, desc }) => (
          <button key={key} type="button" onClick={() => onSelect(key)} className="w-full flex items-center gap-3.5 bg-white rounded-xl p-4 text-left border border-[#DDE2EA] active:scale-[0.98] transition-transform shadow-[0_1px_2px_rgba(26,35,51,0.05)]">
            <div className="w-12 h-12 rounded-xl flex items-center justify-center shrink-0" style={{ backgroundColor: a.soft }}><Icon name="barChart" size={20} color={a.main} /></div>
            <div className="flex-1 min-w-0">
              <p className="text-[15px] font-bold" style={{ ...SANS, color: INK }}>{label}</p>
              <p className="text-[12px] mt-0.5 leading-snug" style={{ ...SANS, color: "#6B7683" }}>{desc}</p>
            </div>
            <Icon name="chevronRight" size={16} color="#C9D0DB" />
          </button>
        ))}
      </div>
    </div>
  );
}

function App() {
  const [view, setView] = useState("home");
  const [status, setStatus] = useState("idle"); // idle | sending | success | error
  const [errorMsg, setErrorMsg] = useState("");

  const openForm = (key) => { setStatus("idle"); setView(key); };
  const backHome = () => { setStatus("idle"); setView("home"); };

  const handleSubmit = async (formType, data, files) => {
    setStatus("sending");
    try {
      await submitForm(formType, data, files);
      setStatus("success");
    } catch (e) {
      setErrorMsg(String(e.message || e));
      setStatus("error");
    }
  };

  const cards = [
    { key: "entry", icon: "mapPin", desc: "入店・退店時に報告" },
    { key: "performance", icon: "barChart", desc: "稼働終了後に実績を報告" },
    { key: "expense", icon: "receipt", desc: "交通費などの経費を申請" },
    { key: "shift", icon: "calendarDays", desc: "翌月の稼働可能日を提出" },
    { key: "meeting", icon: "users", desc: "担当者との面談を申請" },
    { key: "safety", icon: "lifeBuoy", desc: "緊急時の安否を報告" },
    { key: "report", icon: "alertTriangle", desc: "コンプライアンス上の問題を報告" },
  ];
  const adminCards = [{ key: "newStaff", icon: "user", desc: "稼働開始前の基本情報・契約手続き" }];

  return (
    <div className="min-h-screen w-full flex justify-center" style={{ backgroundColor: BG }}>
      <div className="w-full max-w-md min-h-screen flex flex-col" style={{ backgroundColor: BG }}>
        <div className="px-5 pt-5 pb-4 sticky top-0 z-10" style={{ backgroundColor: INK }}>
          <div className="flex items-center gap-2.5">
            {view !== "home" && (<button type="button" onClick={backHome} className="text-white/80 -ml-1.5 p-1 flex items-center gap-0.5"><Icon name="chevronLeft" size={20} /></button>)}
            <div className="flex-1 min-w-0">
              {view === "home" ? (
                <>
                  <div className="flex items-baseline gap-2">
                    <p className="font-oswald text-white text-xl tracking-[0.15em]">PIVO</p>
                    <p className="text-white/60 text-[12px] font-bold" style={SANS}>社内フォーム</p>
                  </div>
                  <p className="text-white/40 text-[10px] tracking-[0.15em] mt-0.5" style={SANS}>軸を持て。そして、動け。</p>
                </>
              ) : (
                <div className="flex items-center justify-between">
                  <p className="text-white text-[16px] font-bold truncate" style={SANS}>{ACCENTS[view].label}</p>
                  <span className="font-oswald text-[10px] tracking-[0.2em] text-white/40 shrink-0 ml-2">{ACCENTS[view].code}</span>
                </div>
              )}
            </div>
          </div>
        </div>

        <div className="flex-1 px-4 py-5">
          {view === "home" && (
            <div>
              <div className="space-y-3">
                {cards.map(({ key, icon, desc }) => {
                  const a = ACCENTS[key];
                  return (
                    <button key={key} type="button" onClick={() => openForm(key)} className="w-full flex items-stretch gap-0 bg-white rounded-xl text-left border-2 border-[#DDE2EA] active:scale-[0.98] transition-transform shadow-[0_1px_3px_rgba(26,35,51,0.08)] overflow-hidden">
                      <div className="w-1.5 shrink-0" style={{ backgroundColor: a.main }} />
                      <div className="flex items-center gap-3.5 flex-1 min-w-0 p-4">
                        <div className="w-14 h-14 rounded-xl flex items-center justify-center shrink-0" style={{ backgroundColor: a.soft }}><Icon name={icon} size={24} color={a.main} /></div>
                        <div className="flex-1 min-w-0">
                          <p className="text-[16px] font-bold leading-tight" style={{ ...SANS, color: INK }}><span style={{ color: a.main }}>{a.code}｜</span>{a.label}</p>
                          <p className="text-[13px] mt-1 leading-snug font-bold" style={{ ...SANS, color: "#4A5568" }}>{desc}</p>
                        </div>
                        <Icon name="chevronRight" size={18} color={a.main} />
                      </div>
                    </button>
                  );
                })}
              </div>

              <p className="text-[13px] font-bold mt-7 mb-3 tracking-wide" style={{ ...SANS, color: "#8A94A6" }}>その他事務手続き</p>
              <div className="space-y-3">
                {adminCards.map(({ key, icon, desc }) => {
                  const a = ACCENTS[key];
                  return (
                    <button key={key} type="button" onClick={() => openForm(key)} className="w-full flex items-stretch gap-0 bg-white rounded-xl text-left border-2 border-[#DDE2EA] active:scale-[0.98] transition-transform shadow-[0_1px_3px_rgba(26,35,51,0.08)] overflow-hidden">
                      <div className="w-1.5 shrink-0" style={{ backgroundColor: a.main }} />
                      <div className="flex items-center gap-3.5 flex-1 min-w-0 p-4">
                        <div className="w-14 h-14 rounded-xl flex items-center justify-center shrink-0" style={{ backgroundColor: a.soft }}><Icon name={icon} size={24} color={a.main} /></div>
                        <div className="flex-1 min-w-0">
                          <p className="text-[16px] font-bold leading-tight" style={{ ...SANS, color: INK }}><span style={{ color: a.main }}>{a.code}｜</span>{a.label}</p>
                          <p className="text-[13px] mt-1 leading-snug font-bold" style={{ ...SANS, color: "#4A5568" }}>{desc}</p>
                        </div>
                        <Icon name="chevronRight" size={18} color={a.main} />
                      </div>
                    </button>
                  );
                })}
              </div>

              <div className="mt-6 rounded-xl border-2 border-[#DDE2EA] bg-white p-4">
                <p className="text-[14px] font-bold mb-1.5" style={{ ...SANS, color: INK }}>お困りのときは</p>
                <p className="text-[13px] leading-relaxed font-bold" style={{ ...SANS, color: "#4A5568" }}>入力・送信でお困りの場合は、担当営業または本社までご連絡ください。</p>
              </div>
            </div>
          )}

          {view !== "home" && status === "sending" && (<SendingOverlay color={ACCENTS[view].main} />)}

          {view !== "home" && status === "idle" && (
            <div>
              {view === "entry" && <EntryForm onSubmit={handleSubmit} />}
              {view === "performance" && <PerformanceBrandMenu onSelect={(brand) => setView(`performance_${brand}`)} />}
              {view === "performance_SBYM" && <PerformanceForm brand="SBYM" onSubmit={handleSubmit} />}
              {view === "performance_Docomo" && <PerformanceForm brand="Docomo" onSubmit={handleSubmit} />}
              {view === "performance_AuUQ" && <PerformanceForm brand="AuUQ" onSubmit={handleSubmit} />}
              {view === "expense" && <ExpenseForm onSubmit={handleSubmit} />}
              {view === "shift" && <ShiftForm onSubmit={handleSubmit} />}
              {view === "meeting" && <MeetingForm onSubmit={handleSubmit} />}
              {view === "safety" && <SafetyForm onSubmit={handleSubmit} />}
              {view === "report" && <ReportForm onSubmit={handleSubmit} />}
              {view === "newStaff" && <NewStaffForm onSubmit={handleSubmit} />}
            </div>
          )}

          {view !== "home" && (status === "success" || status === "error") && (
            <SuccessScreen accentKey={view.startsWith("performance_") ? view : view} onBack={backHome} error={status === "error" ? errorMsg : null} />
          )}
        </div>

        <div className="px-5 py-4 text-center" style={SANS}>
          <p className="text-[10px] tracking-[0.1em]" style={{ color: "#AEB6C2" }}>© 合同会社PIVO — 社内フォーム</p>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
